

name: Build SlotBot APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o slotbot.zip -d .

      - - uses: actions/setup-java@v5
  with:
    distribution: temurin
    java-version: '17'

    
      - name: Install Android packages
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p slotbot assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: slotbot-apk
          path: slotbot/app/build/outputs/apk/debug/app-debug.apk
